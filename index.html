<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano Digital CEDIS — Control Logístico Unificado</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="app-header">
        <div class="header-left">
            <h1>Plano Digital CEDIS</h1>
            <span class="subtitle" id="status-sub">Conectando con base de datos...</span>
        </div>
        <div class="header-right">
            <div class="control-group">
                <label for="viewSelect" class="header-label">VISTA / PLANTA</label>
                <select id="viewSelect" class="select-area">
                    <option value="PB">Planta Baja (Pasillos 101 - 102)</option>
                    <option value="PA">Planta Alta (Pasillos 201 - 228)</option>
                    <option value="AIP_PB">AIP02 - Planta Baja (101-108 / 201-208)</option>
                    <option value="AIP_P1">AIP02 - Piso 1 (301-308 / 401-408)</option>
                    <option value="AIP_P2">AIP02 - Piso 2 (501-508 / 601-608)</option>
                </select>
            </div>

            <!-- FILTRO DE SUB-CURVAS DETALLADAS -->
            <div class="control-group">
                <label for="curvaFilter" class="header-label">CURVA</label>
                <select id="curvaFilter" class="select-area">
                    <option value="TODAS">TODAS LAS CURVAS</option>
                    <option value="A1F">A1F</option>
                    <option value="A2F">A2F</option>
                    <option value="A1S">A1S</option>
                    <option value="A2S">A2S</option>
                    <option value="B1F">B1F</option>
                    <option value="B1S">B1S</option>
                    <option value="B2S">B2S</option>
                    <option value="C1S">C1S</option>
                    <option value="C2S">C2S</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- KPIS SUPERIORES -->
        <section class="kpi-bar">
            <div class="kpi-card">
                <span class="kpi-title">TOTAL LÍNEAS EN SELECCIÓN</span>
                <span class="kpi-value" id="totalLineas">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">LPNs ÚNICOS</span>
                <span class="kpi-value" id="totalLpns">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">SKUs ÚNICOS</span>
                <span class="kpi-value" id="totalSkus">0</span>
            </div>
            <div class="kpi-card kpi-card-highlight">
                <span class="kpi-title kpi-title-curva">CUMPLIMIENTO DE CURVA</span>
                <span class="kpi-value kpi-value-curva" id="kpiCumplimiento">0%</span>
            </div>
        </section>

        <!-- CONTROLES -->
        <section class="controls-bar">
            <div class="control-item">
                <span class="control-label">FILTRAR PASILLOS:</span>
                <div class="multi-select">
                    <button type="button" id="multiButton" class="multi-button">
                        <span id="multiButtonText">Seleccionar pasillos</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div id="multiDropdown" class="multi-dropdown">
                        <div class="multi-actions">
                            <button class="btn-select" id="btnSelectAll">Seleccionar todos</button>
                            <button class="btn-clear" id="btnClearAll">Desmarcar todos</button>
                        </div>
                        <div id="pasilloOptions" class="pasillo-options"></div>
                    </div>
                </div>
            </div>

            <!-- BOTÓN MODO RESUMIDO / DETALLADO -->
            <div class="control-item" id="toggleViewContainer" style="margin-left: auto;">
                <button type="button" id="btnToggleCompact" class="btn-toggle-view">
                    📊 Vista Compacta (Gerencial)
                </button>
            </div>
        </section>

        <!-- MAPA VISUAL -->
        <section id="mapsContainer" class="maps-container">
            <div class="loading-overlay">Cargando mapa visual del almacén...</div>
        </section>
    </main>

    <!-- MODAL DE DETALLE -->
    <div id="modalNiveles" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modalTitle">Detalle de Bahía</h2>
                    <span id="modalSubtitle" class="modal-subtitle">Cargando información...</span>
                </div>
                <button id="modalClose" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
